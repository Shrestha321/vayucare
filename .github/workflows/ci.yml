name: VayuCare CI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Pytest & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: testing
        run: |
          pytest backend

  frontend-quality:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run ESLint
        run: |
          npm --prefix frontend run lint

      - name: Run TypeScript Strict Check
        run: |
          npm --prefix frontend run typecheck

      - name: Run Vitest Component Suite
        run: |
          npm --prefix frontend run test

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm --prefix frontend run build
